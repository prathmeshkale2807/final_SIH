      const dict = translations[currentLang] || translations.en;
      return dict[key] || translations.en[key] || fallback || key;
    }

    function changeLanguage(lang) {
      if (translations[lang]) {
        currentLang = lang;
        localStorage.setItem('krishak_lang', lang);
        document.getElementById('lang-selector').value = lang;
        renderApp();
      }
    }

    function showToast(message, type = 'success') {
      const c = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-xs font-bold border border-slate-700 transform transition-all duration-300';
      toast.innerHTML = `
        <span class="text-base">${type === 'success' ? '🔔' : '⚠️'}</span>
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white pl-2">✕</button>
      `;
      c.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function toggleMobileMenu() {
      mobileMenuOpen = !mobileMenuOpen;
      const drawer = document.getElementById('mobile-menu-drawer');
      const icon = document.getElementById('hamburger-icon');
      if (mobileMenuOpen) {

        icon.className = 'ri-close-line';

      }

      if (currentView !== 'landing') {

        setTimeout(() => {

          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      } else {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function navigateTo(view) {
      currentView = view;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }
